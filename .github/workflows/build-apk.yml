name: Build PixelMusic APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PixelMusic_v0.15.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q PixelMusic_v0.15.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)") && cd "$PROJECT_DIR" && gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelMusic-debug-apk
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
